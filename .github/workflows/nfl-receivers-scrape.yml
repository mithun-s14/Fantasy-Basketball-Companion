name: NFL receiver alignment scrape

on:
  schedule:
    # Tuesdays 16:00 UTC (noon ET), after the week's games wrap with MNF.
    - cron: "0 16 * * 2"
  workflow_dispatch: # allow manual trigger from GitHub UI

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run receiver alignment scraper
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npm run nfl:scrape-receivers
