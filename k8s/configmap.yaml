apiVersion: v1
kind: ConfigMap
metadata:
  name: fantasy-basketball-config
  namespace: fantasy-basketball
data:
  # "redis" resolves to the Redis Service's ClusterIP within the cluster.
  # This works because Kubernetes creates DNS entries for every Service:
  # <service-name>.<namespace>.svc.cluster.local (short form: <service-name>)
  REDIS_URL: "redis://redis:6379"

  # "ai-service" resolves to the ai-service Service's ClusterIP.
  AI_SERVICE_URL: "http://ai-service:3001"

  NODE_ENV: "production"
