apiVersion: v1
kind: Secret
metadata:
  name: fantasy-basketball-secrets
  namespace: fantasy-basketball
# Opaque is the default secret type — arbitrary key/value pairs.
type: Opaque
# Values must be base64-encoded. To encode: echo -n "my-value" | base64
# These are TEMPLATE placeholders. Never commit real values here.
# The local-up.sh script in Phase 4 generates this file from your .env.
data:
  # Supabase — all three are needed server-side.
  # NEXT_PUBLIC_* vars are also baked into the web image at build time,
  # but injecting them at runtime lets server-side code read them from process.env.
  NEXT_PUBLIC_SUPABASE_URL: "<base64-encoded: https://your-project.supabase.co>"
  NEXT_PUBLIC_SUPABASE_ANON_KEY: "<base64-encoded: your-anon-key>"
  SUPABASE_SERVICE_ROLE_KEY: "<base64-encoded: your-service-role-key>"

  # Google Gemini — used only by ai-service
  GEMINI_API_KEY: "<base64-encoded: your-gemini-api-key>"
