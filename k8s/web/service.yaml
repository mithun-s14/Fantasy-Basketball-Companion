apiVersion: v1
kind: Service
metadata:
  name: web
  namespace: fantasy-basketball
  labels:
    app: web             # ServiceMonitor uses this label to find this Service
spec:
  type: ClusterIP
  selector:
    app: web
  ports:
    - name: http         # Named port — referenced by ServiceMonitor
      port: 3000
      targetPort: 3000
      protocol: TCP
