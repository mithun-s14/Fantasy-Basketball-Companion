# Yahoo public-league default DEF scoring.
# Verified 2026-09-27 against https://help.yahoo.com/kb/SLN6489.html (default league settings)
# and https://help.yahoo.com/kb/SLN6442.html: TDs scored against the defense or special teams
# count toward points allowed; safeties never do. Forced fumbles are not scored.
pa_basis: offense_only
points:
  sack: 1
  interception: 2
  fumble_recovery: 2
  st_fumble_recovery: 2
  safety: 2
  blocked_kick: 2
  def_td: 6
  st_td: 6
points_allowed_tiers:
  - {max: 0, points: 10}
  - {max: 6, points: 7}
  - {max: 13, points: 4}
  - {max: 20, points: 1}
  - {max: 27, points: 0}
  - {max: 34, points: -1}
  - {points: -4}
